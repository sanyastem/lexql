<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Lexql</title>
    <base href="/" />
    <script>
        (function () {
            var theme = 'dark';
            try { theme = localStorage.getItem('lexql-theme') || 'dark'; } catch (e) { }
            document.documentElement.dataset.theme = theme;
            window.lexql = {
                getTheme: function () { return document.documentElement.dataset.theme || 'dark'; },
                setTheme: function (value) {
                    document.documentElement.dataset.theme = value;
                    try { localStorage.setItem('lexql-theme', value); } catch (e) { }
                }
            };
            var splashStart = Date.now();
            window.lexqlSplash = {
                hide: function () {
                    var el = document.getElementById('lexql-splash');
                    if (!el) { return; }
                    var wait = Math.max(0, 550 - (Date.now() - splashStart));
                    setTimeout(function () {
                        el.classList.add('hidden');
                        setTimeout(function () { if (el.parentNode) { el.parentNode.removeChild(el); } }, 420);
                    }, wait);
                }
            };
        })();
    </script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/tabulator/tabulator.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="lexql-splash">
        <div class="splash-card">
            <div class="splash-logo">
                <span class="splash-mark">&gt;_</span>
                <span class="splash-name">LexQL</span>
            </div>
            <div class="splash-progress"><span></span></div>
        </div>
    </div>

    <div id="app"></div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="lib/tabulator/tabulator.min.js"></script>
    <script src="lib/monaco/vs/loader.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
